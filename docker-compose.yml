services:
  tracker-api:
    build: ./backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracker-api.rule=PathPrefix(`/tracker/api`)"
      - "traefik.http.routers.tracker-api.priority=10"
      - "traefik.http.services.tracker-api.loadbalancer.server.port=3000"
    volumes:
      - ./data:/app/data
    networks:
      - web

  tracker-ui:
    build: ./frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracker-ui.rule=PathPrefix(`/tracker`)"
      - "traefik.http.routers.tracker-ui.priority=5"
      - "traefik.http.services.tracker-ui.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    external: true
